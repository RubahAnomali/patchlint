name: Bug report
description: Something is wrong (false positive, crash, wrong line number)
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal file that reproduces it
      render: dockerfile
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: patchlint version (`patchlint --version`)
