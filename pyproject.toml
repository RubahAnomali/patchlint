[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patchlint"
version = "0.1.0.dev0"
description = "A beginner-friendly security linter for config files. Every finding explains why and how to fix it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml>=6.0", "tomli>=2.0; python_version < '3.11'"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
patchlint = "patchlint.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/patchlint"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
files = ["src"]
